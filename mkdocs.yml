site_name: Dungeon Shooter Maker
site_description: English manual for the Unity toolkit that makes top-down, room-by-room dungeon shooters from data.
site_url: https://hyunter777.github.io/dungeon-shooter-maker-docs/
repo_url: https://github.com/hyunter777/dungeon-shooter-maker-docs
edit_uri: ''
extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://www.flycat.co.kr
      name: FlyCat
    - icon: fontawesome/brands/github
      link: https://github.com/hyunter777/dungeon-shooter-maker-docs/discussions/categories/q-a
      name: Q&A
copyright: Copyright © 2026 FlyCat
docs_dir: docs/en
site_dir: site
theme:
  name: material
  language: en
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
extra_css:
  - assets/styles.css
plugins:
  - search:
      lang: en
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
nav:
  - Start here:
      - Welcome: index.md
      - Quick start: quick-start.md
  - Making your game:
      - The editors: editors.md
      - Run rules and progression: run-rules.md
      - Content and gameplay: content.md
      - Music and sound: music-sfx.md
  - Help:
      - FAQ and troubleshooting: faq.md
      - Support and licenses: support.md
validation:
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
  nav:
    not_found: warn
    omitted_files: warn
